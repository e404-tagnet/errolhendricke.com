<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Errol Hendrickse — Online Gallery</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    .placeholder-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 4vw;
      background: var(--bg-gradient);
      position: relative;
      overflow: hidden;
    }
    .placeholder-title {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.95;
      color: var(--text-primary);
    }
    .placeholder-subtitle {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 1rem;
    }
    .placeholder-gap {
      height: clamp(2.5rem, 8vh, 5rem);
    }
    .placeholder-soon {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3.5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-strong);
      text-decoration: none;
      border: 2px solid var(--accent-strong);
      padding: 0.9rem 2.2rem;
      border-radius: 100px;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .placeholder-soon:hover,
    .placeholder-soon:focus {
      background: var(--accent-strong);
      color: var(--bg-light);
      outline: none;
    }

    .placeholder-corner {
      position: absolute;
      width: clamp(120px, 18vw, 260px);
      height: clamp(160px, 24vw, 340px);
      overflow: hidden;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      box-shadow: 0 18px 50px rgba(35, 29, 26, 0.18);
      z-index: 1;
      background: var(--frame-dark);
    }
    .placeholder-corner.active {
      opacity: 0.55;
    }
    .placeholder-corner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .corner-tl {
      top: clamp(1rem, 3vw, 2.5rem);
      left: clamp(1rem, 3vw, 2.5rem);
    }
    .corner-br {
      bottom: clamp(1rem, 3vw, 2.5rem);
      right: clamp(1rem, 3vw, 2.5rem);
    }

    @media (max-width: 600px) {
      .placeholder-corner {
        width: clamp(90px, 26vw, 150px);
        height: clamp(120px, 34vw, 200px);
      }
      .corner-tl,
      .corner-br {
        top: auto;
        bottom: auto;
      }
      .corner-tl { top: 1rem; left: 1rem; }
      .corner-br { bottom: 1rem; right: 1rem; }
    }
  </style>
</head>
<body>
  <main class="placeholder-page">
    <h1 class="placeholder-title">Errol Hendrickse</h1>
    <p class="placeholder-subtitle">Online Gallery</p>
    <a href="gallery.html" class="placeholder-soon">Enter Gallery</a>

    <div class="placeholder-corner corner-tl" data-set="tl" aria-hidden="true"></div>
    <div class="placeholder-corner corner-br" data-set="br" aria-hidden="true"></div>
  </main>

  <script>
    (function () {
      const libertyImages = [
        'artworks/Liberty/lb1.jpg',
        'artworks/Liberty/lb2.jpg',
        'artworks/Liberty/lb3.jpg',
        'artworks/Liberty/lb4.jpg'
      ];

      // Split images into two rotating sets, offset by half the cycle
      const half = Math.ceil(libertyImages.length / 2);
      const tlSet = libertyImages.slice(0, half);
      const brSet = libertyImages.slice(half).concat(libertyImages.slice(0, libertyImages.length % 2 ? 1 : 0));

      const tlCorner = document.querySelector('.corner-tl');
      const brCorner = document.querySelector('.corner-br');

      function showImage(container, src) {
        container.innerHTML = '';
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        container.appendChild(img);
        // Force reflow to restart opacity transition
        container.classList.remove('active');
        void container.offsetWidth;
        container.classList.add('active');
      }

      function cycle() {
        const tlIndex = Math.floor(Date.now() / 5000) % tlSet.length;
        const brIndex = Math.floor((Date.now() + 2500) / 5000) % brSet.length;
        showImage(tlCorner, tlSet[tlIndex]);
        showImage(brCorner, brSet[brIndex]);
      }

      function init() {
        cycle();
        setInterval(cycle, 5000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
