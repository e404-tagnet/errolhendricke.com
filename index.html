<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Errol Hendrickse — Online Gallery</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    .placeholder-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 4vw;
      background: var(--bg-gradient);
    }
    .placeholder-title {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.95;
      color: var(--text-primary);
    }
    .placeholder-subtitle {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 1rem;
    }
    .placeholder-gap {
      height: clamp(2.5rem, 8vh, 5rem);
    }
    .placeholder-soon {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3.5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-strong);
    }
  </style>
</head>
<body>
  <main class="placeholder-page">
    <h1 class="placeholder-title">Errol Hendrickse</h1>
    <p class="placeholder-subtitle">Online Gallery</p>
    <div class="placeholder-gap" aria-hidden="true"></div>
    <p class="placeholder-soon">Coming Soon</p>
  </main>
</body>
</html>
