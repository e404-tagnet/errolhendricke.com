<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Errol Hendrickse — Online Gallery</title>
  <link rel="stylesheet" href="assets/style.css?v=24" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    .placeholder-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 4vw;
      background: var(--bg-gradient);
      position: relative;
      overflow: hidden;
    }
.placeholder-title {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 7vw, 5rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      line-height: 1.05;
      color: var(--text-primary);
      text-transform: uppercase;
    }
    .placeholder-title span {
      display: block;
    }
    .placeholder-subtitle {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(0.95rem, 2.4vw, 1.55rem);
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 1.2rem;
    }
    .placeholder-gap {
      height: clamp(3rem, 10vh, 6rem);
    }
    .placeholder-soon {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--accent-strong);
      background: transparent;
      color: transparent;
      overflow: hidden;
      text-indent: -9999px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
      text-decoration: none;
      opacity: 0.35;
      z-index: 100;
    }
    .placeholder-soon:hover,
    .placeholder-soon:focus {
      background: var(--accent-strong);
      transform: translateX(-50%) scale(1.15);
      outline: none;
      opacity: 1;
    }

    .rickroll-trigger {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--frame);
      background: rgba(232, 228, 222, 0.6);
      color: transparent;
      overflow: hidden;
      text-indent: -9999px;
      cursor: pointer;
      opacity: 0.2;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 100;
    }
    .rickroll-trigger:hover,
    .rickroll-trigger:focus {
      opacity: 0.85;
      transform: scale(1.15);
      outline: none;
    }

    .rickroll-overlay {
      position: fixed;
      inset: 0;
      background: rgba(35, 29, 26, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .rickroll-overlay.active {
      display: flex;
    }
    .rickroll-overlay iframe {
      width: min(90vw, 800px);
      height: min(56.25vw, 450px);
      max-height: 80vh;
      border: none;
      border-radius: 6px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
    }
    .rickroll-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      background: transparent;
      color: #fff;
      font-size: 1.4rem;
      line-height: 42px;
      text-align: center;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .placeholder-title {
        font-size: clamp(2rem, 12vw, 4.5rem);
        letter-spacing: 0.18em;
      }
      .placeholder-subtitle {
        font-size: clamp(1rem, 4vw, 1.4rem);
        margin-top: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <main class="placeholder-page">
    <h1 class="placeholder-title"><span>Errol</span><span>Hendrickse</span></h1>
    <p class="placeholder-subtitle">Online Gallery</p>
    <a href="gallery.html" class="placeholder-soon" aria-label="Enter gallery">Enter Gallery</a>
  </main>

  <button class="rickroll-trigger" aria-label="Secret" type="button">Rickroll</button>

  <div class="rickroll-overlay" id="rickrollOverlay" aria-hidden="true">
    <button class="rickroll-close" type="button" aria-label="Close">×</button>
    <iframe title="Rickroll" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  </div>

  <script>
    (function () {
      const trigger = document.querySelector('.rickroll-trigger');
      const overlay = document.getElementById('rickrollOverlay');
      const close = overlay.querySelector('.rickroll-close');
      const iframe = overlay.querySelector('iframe');
      const videoUrl = 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0';

      function open() {
        iframe.src = videoUrl;
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
      }

      function closeOverlay() {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        iframe.src = '';
      }

      trigger.addEventListener('click', open);
      close.addEventListener('click', closeOverlay);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeOverlay();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('active')) closeOverlay();
      });
    })();
  </script>
</body>
</html>
