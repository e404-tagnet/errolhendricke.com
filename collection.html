<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Errol Hendrickse — Collection View</title>
  <link rel="stylesheet" href="assets/style.css?v=26j" />
  <link rel="stylesheet" href="assets/collection.css?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700;800;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">Errol Hendrickse</h1>
    <p class="site-subtitle">Online Gallery</p>
    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">Menu</button>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="collection.html" aria-current="page">Collections</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <section id="collection-overview" class="collection-overview" aria-labelledby="collection-name">
      <div class="overview-text">
        <h2 id="collection-name" class="collection-name">Collection</h2>
        <p id="collection-desc" class="collection-intro">Select a collection to view its paintings.</p>
      </div>
      <div class="overview-thumbs" id="overview-thumbs" aria-label="Collection thumbnails">
        <!-- thumbnails injected by JS -->
      </div>
      <div class="collection-overview-controls">
        <button id="prev-collection" class="control-btn arrow-only" aria-label="Previous collection">←</button>
        <button id="next-collection" class="control-btn arrow-only" aria-label="Next collection">→</button>
      </div>
    </section>

    <section id="artwork-detail" class="artwork-detail" aria-labelledby="artwork-title">
      <div class="detail-image">
        <img id="detail-img" src="" alt="" loading="lazy" />
        <div class="detail-image-nav">
          <button id="prev-artwork" class="control-btn arrow-only" aria-label="Previous artwork">←</button>
          <button id="next-artwork" class="control-btn arrow-only" aria-label="Next artwork">→</button>
        </div>
      </div>
      <div class="detail-info">
        <h3 id="artwork-title" class="artwork-title">Artwork Title</h3>
        <span id="artwork-price" class="artwork-price"></span>
        <div id="artwork-description" class="artwork-description">
          <!-- description injected by JS -->
        </div>
      </div>
    </section>
  </main>

  <section id="contact" class="contact-section">
    <h2>Acquire / Enquire</h2>
    <p>For sales, commissions, and exhibition enquiries, please contact the gallery.</p>
    <div class="contact-card">
      <a class="accent-link" href="mailto:studio@errolhendrickse.uk">studio@errolhendrickse.uk</a>
    </div>
  </section>

  <footer class="site-footer">
    <p>© <span id="year"></span> Errol Hendrickse. All rights reserved.</p>
  </footer>

  <button class="rickroll-trigger" aria-label="Secret" type="button">Rickroll</button>

  <div class="rickroll-overlay" id="rickrollOverlay" aria-hidden="true">
    <button class="rickroll-close" type="button" aria-label="Close">×</button>
    <iframe title="Rickroll" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  </div>

  <script src="assets/collection.js?v=4"></script>
  <script src="assets/rickroll.js"></script>
  <script>
    (function () {
      const menuToggle = document.querySelector('.menu-toggle');
      const siteNav = document.querySelector('.site-nav');
      if (menuToggle && siteNav) {
        menuToggle.addEventListener('click', () => {
          const open = siteNav.classList.toggle('open');
          menuToggle.setAttribute('aria-expanded', String(open));
        });
      }
      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
